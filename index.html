<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de service CAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Outfit:wght@600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning, warm and clear, for 16-18-year-olds on a phone
   IDEA a brasserie's carte: themes are sections of the menu, courses are dishes
   PICTURE the working app; drawn glassware, a vineyard map, mind maps, animated gestures
   COLOUR white ground, burgundy wine dominant, pale citrus support, lime accent
   TYPE Young Serif for titles, Figtree for text
   LAYOUT one column up to 760px, sticky top bar, big tap targets */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#170d12);--ink:light-dark(#1f1418,#f3e9ec);--soft:light-dark(#6b5a60,#bba7ae);--wine:light-dark(#6d1a36,#c9496f);--lime:light-dark(#7cab12,#a8d63a);--citrus:light-dark(#f2f6dc,#24201a);--line:light-dark(#e8dde1,#3a2a31);--card:light-dark(#fbf7f8,#20141a);--ok:light-dark(#2f7d32,#7fd07f);--ko:light-dark(#b3261e,#ff8a80);--glass:light-dark(#eaf3f7,#2a3a42)}
:root{--disp:"Young Serif",Georgia,serif;--shelf:#5a1430;--g1:#a8d63a;--g2:#f2c94c;--g3:#c9496f;--ontop:#14200a}
:root[data-cls=cap1]{--bg:light-dark(#ffffff,#0e1622);--ink:light-dark(#13202e,#e8eef6);--soft:light-dark(#566577,#a9b7c8);--wine:light-dark(#1f4e79,#7fb2e5);--lime:light-dark(#f2b134,#f7c95e);--citrus:light-dark(#fff4dc,#1d2533);--line:light-dark(#dde5ee,#2b3a4d);--card:light-dark(#f7f9fc,#152030);--disp:"Outfit",system-ui,sans-serif;--shelf:#163a5c;--g1:#f2b134;--g2:#ffffff;--g3:#e86a4a;--ontop:#2a1c00}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
a{color:inherit}
img,video{max-width:100%;display:block;border-radius:12px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
#bar{position:sticky;top:0;z-index:5;background:var(--wine);color:#fff}
#bar .wrap{display:flex;align-items:center;gap:10px;min-height:52px}
#back{display:none;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;text-decoration:none;font-size:22px;border-radius:10px}
#back.on{display:flex}
a:focus-visible,button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
#bt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--wine);color:#fff;padding:14px 0 0}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.25)}
.who img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}
.who b{display:block;font-size:17px;line-height:1.2}
.who span{display:block;font-size:14px;opacity:.85;line-height:1.3}
:root[data-cls=cap1] .hero h1{font-weight:700;letter-spacing:-.02em}
.hero h1{font-size:clamp(34px,8vw,48px)}
.hero p{margin:6px 0 0;opacity:.85}
.scene{height:130px;margin-top:14px;overflow:hidden}
.scene svg{display:block}
.ctx{display:inline-flex;gap:8px;align-items:center;background:var(--citrus);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;margin:16px 0 4px}
.ctx b{color:var(--wine)}
a.ctx{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;text-decoration:none;min-height:44px}
.ctx i{white-space:nowrap}
.ctx i{font-style:normal;font-weight:600;color:var(--wine);margin-left:4px}
.cx h2{font-size:22px;margin:28px 0 10px;color:var(--wine)}
.cx .lead{font-size:18px;line-height:1.5;margin:18px 0 0}
.cx dl{margin:0;border-top:1px solid var(--line)}
.cx dl div{display:grid;grid-template-columns:8em minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cx dt{color:var(--soft)}
.cx dd{margin:0}
.cx ul{padding-left:20px;margin:0}
.cx li{margin:6px 0}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;margin:28px 0 8px;border-radius:14px;background:var(--wine);color:#fff;font-weight:700;text-decoration:none;text-align:center;padding:10px 16px}
.addr{display:block;margin-top:6px;opacity:.9;font-size:14px}
.rev{display:flex;align-items:center;gap:14px;width:100%;margin:16px 0 8px;padding:16px;border:0;border-radius:16px;background:var(--lime);color:var(--ontop);text-align:left;text-decoration:none}
.rev strong{display:block;font-size:18px}
.rev span{font-size:14px}
.rev i{margin-left:auto;font-style:normal;font-size:24px}
h2.sec{font-size:24px;margin:28px 0 12px}
.card{display:flex;gap:14px;align-items:flex-start;padding:16px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-decoration:none}
a.card:hover{border-color:var(--wine)}
.ico{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.ico svg{width:30px;height:30px}
.card h3{font-size:20px}
.card p{margin:4px 0 0;color:var(--soft);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--citrus);white-space:nowrap}
.pill.done{background:var(--lime);color:var(--ontop)}
.soon{color:var(--soft);font-size:15px;padding-left:18px}
.cls{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:14px;padding:24px 0 40px}
.cls a{display:block;padding:22px;border-radius:18px;background:var(--card);border:2px solid var(--line);text-decoration:none}
.cls a:hover{border-color:var(--wine)}
.cls b{display:block;font-family:var(--disp);font-weight:400;font-size:40px;color:var(--wine);line-height:1}
.cls span{color:var(--soft)}
.lg{background:#fff;border-radius:16px;padding:20px;margin:0 0 40px;border:1px solid var(--line)}
.lg img{width:100%;max-width:420px;margin:0 auto;border-radius:0}
.cls a[data-c=cap1] b{font-family:Outfit,sans-serif;font-weight:700;color:light-dark(#1f4e79,#7fb2e5)}
.cls a[data-c=cap1]{border-color:light-dark(#f2b134,#f7c95e)}
.ban{color:#fff;padding:20px 0}
.ban .wrap{display:flex;gap:14px;align-items:center}
.ban .ico{width:60px;height:60px;background:rgba(255,255,255,.18)}
.ban .ico svg{width:38px;height:38px}
.ban h1{font-size:clamp(26px,6.5vw,36px)}
.ban p{margin:4px 0 0;opacity:.9;font-size:14px}
.page{padding-top:16px;padding-bottom:40px}
.page>h1{font-size:clamp(28px,7vw,38px)}
.sit{background:var(--citrus);border-radius:16px;padding:16px;margin:4px 0 16px}
.sit b{display:block;color:var(--wine);margin-bottom:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:14px 16px 10px;scrollbar-width:none}
.tab{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--wine);border-color:var(--wine);color:#fff}
.tab .chk{color:var(--lime);margin-left:4px}
.fiche h2{font-size:22px;margin:30px 0 10px;color:var(--wine)}
.fiche ul{padding-left:20px;margin:0}
.fiche li{margin:6px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-weight:700;background:var(--citrus)}
.note{font-size:13px;color:var(--soft);margin:6px 0 0}
.tech{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tc{display:block;width:100%;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.tc svg{display:block;width:84px;height:84px;margin:0 auto 6px}
.tc b{display:block;font-size:17px}
.tc span{display:block;font-size:14px;color:var(--soft);line-height:1.35}
.tc em{display:block;font-style:normal;font-size:13px;color:var(--wine);font-weight:600;margin-top:6px}
.tc.play{border-color:var(--lime)}
.gl{fill:var(--glass);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.mt{fill:#b9c2c9;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.ln{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.dk{fill:var(--ink)}
.wd{fill:#a0703f;stroke:var(--ink);stroke-width:1.5}
.lmn{fill:#a8d63a}.mnt{fill:#3fa34d}.red{fill:#c9496f}.yel{fill:#f2c94c}.pch{fill:#f4a259}.amb{fill:#e07a2e}.ice{fill:#fff;stroke:#9fb4c0;stroke-width:1}
.a1,.a2,.a3,.a4{transform-box:fill-box}
.a1{transform-origin:50% 100%}.a2{transform-origin:50% 80%}.a3{transform-origin:50% 0}.a4{transform-origin:50% 50%}
@keyframes pile{50%{transform:translateY(9px)}}
@keyframes shk{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(14deg) translateY(-6px)}}
@keyframes str{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes spn{50%{transform:scaleX(-1)}}
.play .a1{animation:pile .45s infinite}.play .a2{animation:shk .3s infinite}.play .a3{animation:str .6s infinite}.play .a4{animation:spn .12s infinite}
.glasses{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.gf{flex:0 0 9.5em;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0}
.gf svg{display:block;width:70px;height:96px;margin:0 auto 8px}
.gf b{display:block;font-size:15px;line-height:1.25}
.gf span{display:block;font-size:13px;color:var(--soft);line-height:1.35;margin-top:4px}
.gf em{display:block;font-style:normal;font-size:13px;color:var(--wine);font-weight:600;margin-top:4px}
.map{max-width:440px;margin:0 auto}
.map svg{display:block;width:100%;height:auto}
.map text{font:13px Figtree,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.map .zt{font-weight:700;font-size:15px;fill:var(--wine)}
.map .ct{font-weight:700}
.mm{position:relative}
.mm svg{position:absolute;inset:0;width:100%;height:100%}
.mm .c{position:absolute;transform:translate(-50%,-50%);width:124px;height:124px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;text-align:center;font:18px/1.15 var(--disp);padding:10px}
.mm .b{position:absolute;transform:translate(-50%,-50%);width:200px;background:var(--bg);border:2px solid var(--k);border-radius:14px;overflow:hidden}
.mm .b b{display:block;background:var(--k);color:var(--kt);padding:6px 10px;font-size:15px}
.mm .b ul{margin:0;padding:6px 10px 8px 24px;font-size:14px;line-height:1.35}
.mm .b li{margin:2px 0}
.mmt{display:grid;gap:10px}
.mmt .c{position:static;transform:none;width:auto;height:auto;border-radius:14px;padding:12px}
.mmt .b{position:static;transform:none;width:auto}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 16px 52px;margin:0;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font-weight:700}
.steps li::after{content:"";position:absolute;left:17px;top:38px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps b{display:block;font-size:17px;padding-top:6px}
.steps span{color:var(--soft)}
.resa{background:light-dark(#fffdf6,#221c14);border:1px solid var(--line);border-radius:6px;padding:14px 16px;box-shadow:0 2px 0 var(--line),0 4px 0 var(--line);font-size:15px}
.resa h3{font-size:18px;color:var(--wine);margin-bottom:8px}
.resa div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.resa dt,.resa .k{color:var(--soft)}
.resa .v{font-family:var(--disp);color:light-dark(#1d3f8a,#9ab8ff)}
figure.md{margin:0}
figure.md figcaption{font-size:14px;color:var(--soft);margin-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--wine);transition:width .3s}
.qn{font-size:14px;color:var(--soft)}
.q h3{font-family:Figtree,sans-serif;font-weight:700;font-size:19px;line-height:1.35;margin:6px 0 14px}
.ch{display:block;width:100%;min-height:48px;margin:8px 0;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:left;cursor:pointer}
.ch.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.ch.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 12%,var(--bg))}
.ch:disabled{cursor:default}
.ex{margin:12px 0 0;padding:12px;border-radius:12px;background:var(--citrus);font-size:15px}
.tag{font-size:13px;color:var(--wine);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:12px;border:0;background:var(--wine);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--citrus);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.end{text-align:center;padding:24px 12px}
.end .big{font-family:var(--disp);font-size:56px;color:var(--wine);line-height:1}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.m{min-height:56px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px;line-height:1.25}
.m.sel{border-color:var(--wine);background:color-mix(in srgb,var(--wine) 10%,var(--bg))}
.m.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg));cursor:default}
.m.bad{border-color:var(--ko);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.m.bad,.play .a1,.play .a2,.play .a3,.play .a4{animation:none}.prog i{transition:none}}
.hint{color:var(--soft);font-size:14px;margin:0 0 10px}
.grid{display:grid;gap:2px;margin:8px auto 4px;width:max-content;max-width:100%}
.cell{position:relative;width:min(36px,calc((min(100vw,760px) - 36px - var(--cols) * 2px) / var(--cols)));aspect-ratio:1}
.cell input{width:100%;height:100%;border:1.5px solid var(--ink);border-radius:3px;background:var(--bg);color:var(--ink);text-align:center;font:700 16px Figtree,sans-serif;text-transform:uppercase;padding:0}
.cell input:focus{outline:none;background:color-mix(in srgb,var(--lime) 35%,var(--bg))}
.cell input.hl{background:color-mix(in srgb,var(--lime) 15%,var(--bg))}
.cell input.ok{color:var(--ok);border-color:var(--ok)}
.cell input.ko{color:var(--ko);border-color:var(--ko)}
.cell sup{position:absolute;top:1px;left:2px;font-size:9px;line-height:1;pointer-events:none;color:var(--soft)}
.clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:4px 20px;margin-top:14px}
.clues h3{font-size:18px;margin:10px 0 4px;color:var(--wine)}
.clue{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:15px}
.clue.cur{background:var(--citrus)}
.clue b{display:inline-block;min-width:1.6em}
.memo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mtile{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;min-height:118px}
.mtile:hover{border-color:var(--wine)}
.mtile .ico{width:40px;height:40px}
.mtile .ico svg{width:26px;height:26px}
.mtile b{font-size:16px;line-height:1.2}
.mtile span{font-size:13px;color:var(--soft)}
@media(min-width:640px){.memo{grid-template-columns:repeat(4,minmax(0,1fr))}}
details.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.fc>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:64px}
details.fc>summary::-webkit-details-marker{display:none}
details.fc>summary::after{content:"+";margin-left:auto;font-size:24px;color:var(--wine);flex:none}
details.fc[open]>summary::after{content:"−"}
details.fc>summary svg{flex:none;width:34px;height:46px}
.fs b{display:block;font-size:17px;line-height:1.2}
.fs span{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.fb{padding:0 14px 16px}
.fb h4{font-size:15px;margin:14px 0 6px;color:var(--wine)}
.fb ul{margin:0;padding-left:20px}
.fb table td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.vg{background:var(--citrus);border-radius:12px;padding:10px 12px;margin-top:12px}
.vg b{display:block;margin-bottom:4px}
.say{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--wine) 9%,var(--bg));font-style:italic}
.say::before{content:"À dire au client";display:block;font-style:normal;font-weight:700;font-size:13px;color:var(--wine);margin-bottom:4px}
.lbl{border:2px solid var(--lime);background:color-mix(in srgb,var(--lime) 12%,var(--bg));border-radius:16px;padding:16px;margin-bottom:8px}
.lbl>b{display:block;font-size:19px;margin-bottom:6px}
.lbl p{margin:0 0 10px}
.ex5{display:block;margin-top:4px;font-size:14px;color:var(--ink)!important;background:var(--citrus);border-radius:10px;padding:8px 10px}
.nbp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.nbp>b{display:block;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.names input{min-height:44px;font:16px Figtree,sans-serif;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.sbi{border-radius:12px;padding:8px 12px;border:2px solid transparent;opacity:.6}
.sbi b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbi span{font-size:20px;font-weight:700}
.sbi.p0{background:color-mix(in srgb,#e8a33d 22%,var(--bg))}
.sbi.p1{background:color-mix(in srgb,#3d8be8 22%,var(--bg))}
.sbi.cur{opacity:1}.sbi.p0.cur{border-color:#e8a33d}.sbi.p1.cur{border-color:#3d8be8}
.turn{text-align:center;font-size:17px;margin:0 0 10px}
.pj{font-weight:700;padding:2px 10px;border-radius:999px;color:#14202a}
.pj.p0{background:#f4c77e}.pj.p1{background:#9cc4f4}
.mg.m4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mg.m4 .mc .fr b{font-size:12px}
.mg.m4 .mc .bk i{font-size:9px}
.km{position:absolute;right:7px;bottom:5px;font-size:9px;font-weight:700;letter-spacing:.04em;text-decoration:none;color:#14303b;opacity:.75}
.jw{position:relative;display:block}
.jw .km{background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px;right:8px;bottom:8px;opacity:1}
.gc{position:relative}
.km.kg{top:8px;bottom:auto;right:8px;background:rgba(255,255,255,.88);padding:1px 6px;border-radius:6px;opacity:1}

function scene(W){

 for(const o of OBJ){const need=used+(pick.length?gap:0)+o[0]*k;if(need>W-20)continue;used=need;pick.push(o)}
 let x=(W-used)/2;const g=pick.map(o=>{const s=`<g transform="translate(${x.toFixed(1)} ${base}) scale(${k})">${o[1]}</g>`;x+=o[0]*k+gap;return s}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><rect y="${base}" width="${W}" height="${H-base}" style="fill:var(--shelf)"/>${g}</svg>`;
}

function quiz(p,items,key,after){
 let i=0,score=0;
 const qs=items.map(x=>{if(!x.shuf)return x;const o=shuffle(x.choix.map((t,j)=>({t,ok:j===x.ok})));return {...x,choix:o.map(y=>y.t),ok:o.findIndex(y=>y.ok)}});
 const draw=()=>{
  if(i>=qs.length){
   const best=Math.max(score,store.get(key)?.best||0);store.set(key,{best,n:qs.length});after&&after();
   const msg=score===qs.length?'Parfait, rien à redire.':score>=qs.length*.7?'Bien. Relis la fiche pour les points ratés.':'Il faut retravailler la fiche avant de recommencer.';
   p.innerHTML=`<div class="q end"><div class="big">${score}/${qs.length}</div><p>${msg}</p><p class="qn">Meilleur score : ${best}/${qs.length}</p><div class="row" style="justify-content:center"><button class="btn" id="again">Recommencer</button></div></div>`;
   $('#again').onclick=()=>quiz(p,items,key,after);return}
  const q=qs[i];
  p.innerHTML=`<div class="q"><div class="prog"><i style="width:${i/qs.length*100}%"></i></div><div class="qn">Question ${i+1} sur ${qs.length}${q.src?` · <span class="tag">${esc(q.src)}</span>`:''}</div><h3>${esc(q.q)}</h3>${q.choix.map((t,j)=>`<button class="ch" data-j="${j}">${esc(t)}</button>`).join('')}<div id="fb"></div></div>`;
  p.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
   const j=+b.dataset.j;const good=j===q.ok;if(good)score++;
   p.querySelectorAll('.ch').forEach((x,k)=>{x.disabled=true;if(k===q.ok)x.classList.add('ok')});
   if(!good)b.classList.add('ko');
   $('#fb').innerHTML=`<div class="ex"><b>${good?'Bonne réponse.':'Raté.'}</b> ${esc(q.expl||'')}</div><div class="row"><button class="btn" id="nx">${i+1<qs.length?'Question suivante':'Voir mon score'}</button></div>`;
   $('#nx').onclick=()=>{i++;draw()};$('#nx').focus();
  });
 };
 draw();
}

function match(p,pairs,key,after){
 const L=shuffle(pairs.map((x,i)=>({t:x[0],i}))),R=shuffle(pairs.map((x,i)=>({t:x[1],i})));
 let sel=null,errs=0,found=0;
 p.innerHTML=`<p class="hint">Touche un élément à gauche, puis sa définition à droite.</p><div class="match">${L.map((x,k)=>`<button class="m" data-s="L" data-i="${x.i}" style="grid-column:1;grid-row:${k+1}">${esc(x.t)}</button>`).join('')}${R.map((x,k)=>`<button class="m" data-s="R" data-i="${x.i}" style="grid-column:2;grid-row:${k+1}">${esc(x.t)}</button>`).join('')}</div><div id="mres"></div>`;
 p.querySelector('.match').addEventListener('click',e=>{
  const b=e.target.closest('.m');if(!b||b.classList.contains('done'))return;
  if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
  if(sel.dataset.i===b.dataset.i){[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true});found++;
   if(found===pairs.length){store.set(key,{errs});after&&after();$('#mres').innerHTML=`<div class="q end"><div class="big">✓</div><p>Toutes les paires trouvées, avec ${errs} erreur${errs>1?'s':''}.</p><div class="row" style="justify-content:center"><button class="btn" id="again">Recommencer</button></div></div>`;$('#again').onclick=()=>match(p,pairs,key,after)}}
  else{errs++;const a=sel;[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('bad')});setTimeout(()=>[a,b].forEach(x=>x.classList.remove('bad')),600)}
  sel=null;
 });
}

function layout(words){
 const ws=words.map(w=>({def:w.def,a:norm(w.mot)})).filter(w=>w.a.length>1).sort((x,y)=>y.a.length-x.a.length);
 const L=new Map(),Dm=new Map(),placed=[];
 const at=(r,c)=>L.get(r+','+c);
 const can=(w,r,c,d)=>{const dr=d,dc=1-d;let x=0;
  if(at(r-dr,c-dc)||at(r+dr*w.length,c+dc*w.length))return -1;
  for(let i=0;i<w.length;i++){const rr=r+dr*i,cc=c+dc*i,k=rr+','+cc,v=L.get(k);
   if(v){if(v!==w[i]||(Dm.get(k)&(1<<d)))return -1;x++}
   else if(at(rr+dc,cc+dr)||at(rr-dc,cc-dr))return -1}
  return x};
 const put=(w,r,c,d)=>{for(let i=0;i<w.a.length;i++){const k=(r+d*i)+','+(c+(1-d)*i);L.set(k,w.a[i]);Dm.set(k,(Dm.get(k)||0)|(1<<d))}placed.push({...w,r,c,d})};
 let rest=ws.slice(1);put(ws[0],0,0,0);
 for(let pass=0;pass<3&&rest.length;pass++){
  const left=[];
  for(const w of rest){let best=null;
   for(const [k,ch] of L){const [cr,cc]=k.split(',').map(Number);
    for(let j=0;j<w.a.length;j++){if(w.a[j]!==ch)continue;
     for(const d of [0,1]){const r=cr-d*j,c=cc-(1-d)*j,s=can(w.a,r,c,d);
      if(s>0){const sc=s*10-Math.abs(r)-Math.abs(c);if(!best||sc>best.sc)best={r,c,d,sc}}}}}
   if(best)put(w,best.r,best.c,best.d);else left.push(w)}
  rest=left}
 let r0=1e9,c0=1e9,r1=-1e9,c1=-1e9;
 for(const k of L.keys()){const [r,c]=k.split(',').map(Number);r0=Math.min(r0,r);c0=Math.min(c0,c);r1=Math.max(r1,r);c1=Math.max(c1,c)}
 placed.forEach(w=>{w.r-=r0;w.c-=c0});
 placed.sort((a,b)=>a.r-b.r||a.c-b.c);
 const nums=new Map();let n=0;placed.forEach(w=>{const k=w.r+','+w.c;if(!nums.has(k))nums.set(k,++n);w.n=nums.get(k)});
 const cells=new Map();for(const [k,v] of L){const [r,c]=k.split(',').map(Number);cells.set((r-r0)+','+(c-c0),v)}
 return {placed,cells,nums,rows:r1-r0+1,cols:c1-c0+1};
}

function cross(p,words,key,after){
 const G=layout(words);let dir=0,cur=null;
 let h=`<p class="hint">Touche une définition ou une case, puis écris. Les accents ne comptent pas.</p><div class="grid" style="--cols:${G.cols};grid-template-columns:repeat(${G.cols},auto)">`;
 for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){const k=r+','+c;
  h+=G.cells.has(k)?`<div class="cell">${G.nums.has(k)?`<sup>${G.nums.get(k)}</sup>`:''}<input maxlength="1" data-k="${k}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Case ${r+1}-${c+1}"></div>`:'<div class="cell"></div>'}
 h+=`</div><div class="row"><button class="btn" id="chk">Vérifier</button><button class="btn alt" id="sol">Solution</button><button class="btn alt" id="clr">Effacer</button></div><div id="cres"></div><div class="clues">`;
 for(const d of [0,1]){h+=`<div><h3>${d?'Verticalement':'Horizontalement'}</h3>${G.placed.map((w,i)=>w.d===d?`<button class="clue" data-w="${i}"><b>${w.n}.</b> ${esc(w.def)} (${w.a.length})</button>`:'').join('')}</div>`}
 h+='</div>';p.innerHTML=h;
 const inp=k=>p.querySelector(`input[data-k="${k}"]`);
 const wordsAt=k=>G.placed.filter(w=>{const [r,c]=k.split(',').map(Number);return w.d===0?(r===w.r&&c>=w.c&&c<w.c+w.a.length):(c===w.c&&r>=w.r&&r<w.r+w.a.length)});
 const cellsOf=w=>[...w.a].map((_,i)=>(w.r+w.d*i)+','+(w.c+(1-w.d)*i));
 const hl=w=>{p.querySelectorAll('input.hl').forEach(x=>x.classList.remove('hl'));p.querySelectorAll('.clue.cur').forEach(x=>x.classList.remove('cur'));if(!w)return;cur=w;cellsOf(w).forEach(k=>inp(k).classList.add('hl'));const b=p.querySelector(`.clue[data-w="${G.placed.indexOf(w)}"]`);b&&b.classList.add('cur')};
 p.querySelectorAll('.cell input').forEach(el=>{
  el.addEventListener('focus',()=>{const ws=wordsAt(el.dataset.k);const w=ws.find(x=>x.d===dir)||ws[0];if(w){dir=w.d;hl(w)}});
  el.addEventListener('input',()=>{el.value=norm(el.value).slice(-1);el.classList.remove('ok','ko');if(el.value&&cur){const ks=cellsOf(cur),i=ks.indexOf(el.dataset.k);if(i>=0&&i<ks.length-1)inp(ks[i+1]).focus()}});
  el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&cur){const ks=cellsOf(cur),i=ks.indexOf(el.dataset.k);if(i>0){e.preventDefault();const pv=inp(ks[i-1]);pv.value='';pv.focus()}}});
  el.addEventListener('click',()=>{const ws=wordsAt(el.dataset.k);if(ws.length>1&&document.activeElement===el){dir=1-dir;hl(ws.find(x=>x.d===dir))}});
 });
 p.querySelectorAll('.clue').forEach(b=>b.onclick=()=>{const w=G.placed[+b.dataset.w];dir=w.d;const ks=cellsOf(w);const e=ks.map(inp).find(x=>!x.value)||inp(ks[0]);e.focus();hl(w)});
 $('#chk').onclick=()=>{let ok=0,tot=0;for(const [k,v] of G.cells){const e=inp(k);tot++;e.classList.remove('ok','ko');if(e.value){e.classList.add(e.value===v?'ok':'ko');if(e.value===v)ok++}}
  if(ok===tot){store.set(key,true);after&&after();$('#cres').innerHTML='<div class="ex"><b>Grille complète, bravo.</b></div>'}else $('#cres').innerHTML=`<div class="ex">${ok} cases justes sur ${tot}.</div>`};
 $('#sol').onclick=()=>{for(const [k,v] of G.cells){const e=inp(k);e.value=v;e.classList.remove('ko','ok')}$('#cres').innerHTML='<div class="ex">Solution affichée : efface et refais la grille pour la valider.</div>'};
 $('#clr').onclick=()=>{p.querySelectorAll('.cell input').forEach(e=>{e.value='';e.classList.remove('ok','ko')});$('#cres').innerHTML=''};
}

function gScrab(p,P,g,few){const ws=shuffle(P.mots.filter(m=>m.key.length>=4&&m.key.length<=10)).slice(0,5);if(ws.length<3)return few();
 let i=0,score=0;

 draw();gTimer=setInterval(()=>{const left=end-Date.now();if(!$('#tb')){stopT();return}if(left<=0){stopT();endG(p,g,ok,`bonne${ok>1?'s':''} réponse${ok>1?'s':''} en 60 secondes (${ko} erreur${ko>1?'s':''}).`,()=>gChrono(p,P,g,few));return}$('#tb').style.width=left/600+'%';$('#tl').textContent=Math.ceil(left/1000)},200)}
function gEclair(p,P,g,few){if(P.qcm.length<10)return few();
 const qs=shuffle(P.qcm).slice(0,10).map(x=>{const o=shuffle(x.choix.map((t,j)=>({t,ok:j===x.ok})));return {...x,choix:o.map(y=>y.t),ok:o.findIndex(y=>y.ok)}});let i=0,score=0;
 const next=()=>{stopT();if(i>=qs.length)return endG(p,g,score,'points sur 10 questions. Plus tu réponds vite, plus tu marques.',()=>gEclair(p,P,g,few));
  const q=qs[i],t0=Date.now();let done=false;
  p.innerHTML=`<div class="q"><div class="prog"><i id="tb" style="width:100%"></i></div><div class="qn">Question ${i+1}/10 · ${score} pts · <span class="tag">${esc(q.src)}</span></div><h3>${esc(q.q)}</h3>${q.choix.map((t,j)=>`<button class="ch" data-j="${j}">${esc(t)}</button>`).join('')}</div>`;
  const fin=j=>{if(done)return;done=true;stopT();const left=Math.max(0,10-(Date.now()-t0)/1000);if(j===q.ok)score+=Math.ceil(left);
   p.querySelectorAll('.ch').forEach((x,k)=>{x.disabled=true;if(k===q.ok)x.classList.add('ok');else if(k===j)x.classList.add('ko')});setTimeout(()=>{i++;next()},j===q.ok?700:1500)};
  p.querySelectorAll('.ch').forEach(b=>b.onclick=()=>fin(+b.dataset.j));
  gTimer=setInterval(()=>{const left=10-(Date.now()-t0)/1000;const tb=$('#tb');if(!tb){stopT();return}tb.style.width=Math.max(0,left*10)+'%';if(left<=0)fin(-1)},100)};
 next()}
function gQui(p,P,g,few){const ws=shuffle(P.mots.filter(m=>m.key.length>=4)).slice(0,5);if(ws.length<3)return few();
 let i=0,score=0;
 const next=()=>{if(i>=ws.length)return endG(p,g,score,'points sur '+ws.length+' mots (3 points sans indice).',()=>gQui(p,P,g,few));
  const w=ws[i];let h=1;
  const hints=()=>[`J'ai ${w.key.length} lettres. On m'a vu dans « ${w.src} ».`,`Ma définition : ${w.def}`,`Je commence par ${w.key[0]} et je finis par ${w.key.at(-1)}.`].slice(0,h);
  const draw=()=>{p.innerHTML=`<div class="q"><div class="qn">Mot ${i+1} sur ${ws.length} · ${score} pts</div><h3>Qui suis-je ?</h3><ol class="hints">${hints().map(t=>`<li>${esc(t)}</li>`).join('')}</ol><input class="srch" id="ans" autocomplete="off" autocapitalize="characters" placeholder="Ta réponse" aria-label="Ta réponse"><div class="row"><button class="btn" id="ok">Valider</button>${h<3?`<button class="btn alt" id="hi">Un indice (−1 pt)</button>`:''}<button class="btn alt" id="gv">Je donne ma langue au chat</button></div><div id="fb"></div></div>`;
   const a=$('#ans');a.focus();a.onkeydown=e=>{if(e.key==='Enter')$('#ok').click()};
   $('#ok').onclick=()=>{if(norm(a.value)===w.key){const pts=4-h;score+=pts;fin(`Bravo, c'était ${w.mot} : +${pts} pt${pts>1?'s':''}.`)}else{a.classList.add('bad');setTimeout(()=>a.classList.remove('bad'),400)}};
   const hi=$('#hi');if(hi)hi.onclick=()=>{h++;draw()};$('#gv').onclick=()=>fin(`C'était : ${w.mot}.`)};
  const fin=t=>{p.querySelectorAll('#ok,#hi,#gv,#ans').forEach(b=>b.disabled=true);$('#fb').innerHTML=`<div class="ex"><b>${esc(t)}</b> ${esc(w.def)}</div><div class="row"><button class="btn" id="nx">${i+1<ws.length?'Mot suivant':'Voir mon score'}</button></div>`;$('#nx').onclick=()=>{i++;next()}};
  draw()};
 next()}
function gOrdre(p,P,g,few){if(!P.etapes.length)return few();
 const set=shuffle(P.etapes).slice(0,3);let i=0,errs=0;
 const next=()=>{if(i>=set.length)return endG(p,g,errs,`erreur${errs>1?'s':''} sur ${set.length} série${set.length>1?'s':''} d'étapes.`,()=>gOrdre(p,P,g,few));
  const s=set[i],L=shuffle(s.items.map((t,k)=>({t,k})));let n=0;
  const draw=()=>{p.innerHTML=`<div class="q"><div class="qn">Série ${i+1} sur ${set.length} · ${errs} erreur${errs>1?'s':''} · <span class="tag">${esc(s.src)}</span></div><h3>${esc(s.h)}</h3><p class="hint">Touche les étapes dans le bon ordre.</p><ol class="steps">${s.items.slice(0,n).map(t=>`<li><b>${esc(t)}</b></li>`).join('')}</ol><div class="ord">${L.filter(x=>x.k>=n).map(x=>`<button class="ch" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div><div id="fb"></div></div>`;
   p.querySelector('.ord').onclick=e=>{const b=e.target.closest('.ch');if(!b)return;if(+b.dataset.k===n){n++;if(n===s.items.length){draw();$('#fb').innerHTML=`<div class="row"><button class="btn" id="nx">${i+1<set.length?'Série suivante':'Voir mon score'}</button></div>`;$('#nx').onclick=()=>{i++;next()}}else draw()}else{errs++;b.classList.add('ko');setTimeout(()=>b.classList.remove('ko'),500);p.querySelector('.qn').firstChild.textContent=`Série ${i+1} sur ${set.length} · ${errs} erreur${errs>1?'s':''} · `}}};
  draw()};
 next()}
function gDosage(p,P,g,few){const cs=cocktailsSeen();const qs=[];
 cs.forEach(c=>[[c.nom,c.ings],[c.virgin.nom,c.virgin.ings]].forEach(([n,ings])=>ings.forEach(([ing,d])=>{const m=String(d).match(/^(\d+(?:[.,]\d+)?)\s*cl$/);if(m)qs.push({n,ing,v:parseFloat(m[1].replace(',','.'))})})));
 if(qs.length<4)return few();
 const set=shuffle(qs).slice(0,8),D_=[1,1.5,2,3,4,5,6,8,9,10,12];let i=0,score=0;const f=v=>String(v).replace('.',',')+' cl';
 const next=()=>{if(i>=set.length)return endG(p,g,score,'bonnes réponses sur '+set.length+'.',()=>gDosage(p,P,g,few));
  const q=set[i],opts=shuffle([q.v,...shuffle(D_.filter(x=>x!==q.v)).slice(0,3)]);
  p.innerHTML=`<div class="q"><div class="qn">Question ${i+1} sur ${set.length} · ${score} bonne${score>1?'s':''}</div><h3>Combien de ${esc(q.ing.toLowerCase())} dans un ${esc(q.n)} ?</h3><div class="dose">${opts.map(o=>`<button class="ch" data-v="${o}">${f(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
  p.querySelector('.dose').onclick=e=>{const b=e.target.closest('.ch');if(!b||b.disabled)return;const ok=+b.dataset.v===q.v;if(ok)score++;
   p.querySelectorAll('.ch').forEach(x=>{x.disabled=true;if(+x.dataset.v===q.v)x.classList.add('ok')});if(!ok)b.classList.add('ko');
   $('#fb').innerHTML=`<div class="row"><button class="btn" id="nx">${i+1<set.length?'Suivante':'Voir mon score'}</button></div>`;$('#nx').onclick=()=>{i++;next()}}};
 next()}
function gAssoc(p,P,g,few){const s=new Set(),ps=shuffle(P.paires).filter(x=>!s.has(x.a)&&s.add(x.a)).slice(0,6);if(ps.length<6)return few();
 const t0=Date.now();p.innerHTML=`<p class="chrono">⏱ <span id="tl">0</span> s</p><div id="ma"></div>`;
 gTimer=setInterval(()=>{const tl=$('#tl');if(!tl){stopT();return}tl.textContent=Math.floor((Date.now()-t0)/1000)},250);
 match($('#ma'),ps.map(x=>[x.a,x.b]),'g:assoc-last',()=>{stopT();const sec=Math.round((Date.now()-t0)/1000);setTimeout(()=>endG(p,g,sec,'secondes pour trouver les 6 paires.',()=>gAssoc(p,P,g,few)),900)})}
function gCroises(p,P,g,few){const ws=shuffle(P.mots.filter(m=>m.key.length>=3&&m.key.length<=10)).slice(0,7);if(ws.length<4)return few();
 p.innerHTML=`<div id="cw"></div><div class="row"><button class="btn alt" id="nw">Nouvelle grille</button></div>`;cross($('#cw'),ws.map(m=>({mot:m.key,def:m.def})),'g:croises',null);$('#nw').onclick=()=>gCroises(p,P,g,few)}
function gMemoMots(p,P,g,few){const ws=shuffle(P.mots.filter(m=>m.def.length<=70)).slice(0,6);if(ws.length<6)return few();
 let cards=[];ws.forEach((w,i)=>{cards.push({i,t:w.mot,k:'m'});cards.push({i,t:w.def,k:'d'})});cards=shuffle(cards);let open=[],found=0,coups=0,lock=false;
 p.innerHTML=`<p class="hint"><span id="cp">0</span> coups · Retourne un mot et sa définition.</p><div class="mw">${cards.map((c,j)=>`<button class="wc ${c.k}" data-j="${j}"><span class="in"><span class="bk">?</span><span class="fr">${esc(c.t)}</span></span></button>`).join('')}</div>`;
 p.querySelector('.mw').onclick=e=>{const b=e.target.closest('.wc');if(!b||lock||b.classList.contains('up'))return;b.classList.add('up');open.push(b);if(open.length<2)return;
  coups++;$('#cp').textContent=coups;const [a,c]=open;open=[];
  if(cards[a.dataset.j].i===cards[c.dataset.j].i&&a.dataset.j!==c.dataset.j){a.classList.add('ok');c.classList.add('ok');found++;if(found===ws.length)setTimeout(()=>endG(p,g,coups,'coups pour retrouver les 6 paires.',()=>gMemoMots(p,P,g,few)),700)}
  else{lock=true;setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');lock=false},1200)}}}

/* ---------- mode prof : projection et quiz de classe ---------- */
function proj(slides,title){
 let i=0;const ov=document.createElement('div');ov.className='proj';document.body.appendChild(ov);document.body.style.overflow='hidden';
 const close=()=>{ov.remove();document.body.style.overflow='';removeEventListener('keydown',key)};
 const draw=()=>{ov.innerHTML=`<div class="pt"><span>${esc(title)}</span><span>${i+1} / ${slides.length}</span><button id="px" aria-label="Fermer">✕</button></div><div class="pb">${slides[i]}</div><div class="pn"><button id="pp" ${i?'':'disabled'}>←</button><button id="pf" ${i<slides.length-1?'':'disabled'}>→</button></div>`;
  ov.querySelector('#px').onclick=close;ov.querySelector('#pp').onclick=()=>{if(i>0){i--;draw()}};ov.querySelector('#pf').onclick=()=>{if(i<slides.length-1){i++;draw()}};
  ov.querySelectorAll('.tc').forEach(b=>b.onclick=()=>b.classList.toggle('play'));ov.querySelectorAll('.fc2').forEach(b=>b.onclick=()=>b.classList.toggle('up'));
  ov.querySelectorAll('.mm').forEach(el=>drawMM(el));ov.querySelectorAll('.rv').forEach(b=>b.onclick=()=>{ov.querySelector('.pb').classList.add('shown');b.remove()});
  ov.querySelectorAll('.tm b').forEach((b,k)=>b.textContent=TS[k]);ov.querySelectorAll('.tm button').forEach(b=>b.onclick=()=>{const k=+b.dataset.t;TS[k]+=+b.dataset.d;ov.querySelectorAll('.tm b')[k].textContent=TS[k]})};
 const key=e=>{if(e.key==='ArrowRight'&&i<slides.length-1){i++;draw()}if(e.key==='ArrowLeft'&&i>0){i--;draw()}if(e.key==='Escape')close()};
 addEventListener('keydown',key);try{ov.requestFullscreen?.().catch(()=>{})}catch(e){}draw()}
let TS=[0,0,0];
function projFiche(c){const tmp=document.createElement('div');fiche(tmp,c);
 const sl=[`<div class="ps"><h1>${esc(c.titre)}</h1><div class="sit"><b>Situation professionnelle</b>${esc(c.situation)}</div></div>`];
 [...tmp.querySelector('.fiche').children].reduce((acc,el)=>{if(el.tagName==='H2'||el.tagName==='DETAILS')acc.push([el]);else if(acc.length)acc.at(-1).push(el);return acc},[]).forEach(g=>{
  if(g[0].tagName==='DETAILS'){[...g[0].children].filter(x=>x.tagName!=='SUMMARY').reduce((a,el)=>{if(el.tagName==='H2')a.push([el]);else if(a.length)a.at(-1).push(el);return a},[]).forEach(h=>sl.push(`<div class="ps fiche"><span class="kick">Pour aller plus loin</span>${h.map(x=>x.outerHTML).join('')}</div>`))}
  else sl.push(`<div class="ps fiche">${g.map(x=>x.outerHTML).join('')}</div>`)});
 proj(sl,c.titre)}
function classQuiz(c){TS=[0,0,0];
 const qs=[...c.qcm.map(x=>({q:x.q,choix:x.choix,ok:x.ok,expl:x.expl})),...c.vf.map(x=>({q:x.a,choix:['Vrai','Faux'],ok:x.v?0:1,expl:x.expl}))];
 const team=`<div class="tm">${['Équipe A','Équipe B','Équipe C'].map((n,k)=>`<div><span>${n}</span><b>${TS[k]}</b><button data-t="${k}" data-d="1">+1</button><button data-t="${k}" data-d="-1">−1</button></div>`).join('')}</div>`;
 proj(qs.map((x,n)=>{const o=x.choix.map((t,j)=>({t,j}));const sh=x.choix.length>2?shuffle(o):o;return `<div class="ps cq"><span class="kick">Question ${n+1}</span><h2>${esc(x.q)}</h2><ol type="A">${sh.map(y=>`<li class="${y.j===x.ok?'good':''}">${esc(y.t)}</li>`).join('')}</ol><button class="btn rv">Révéler la réponse</button><p class="xp">${esc(x.expl||'')}</p>${team}</div>`}),'Quiz de classe · '+c.titre)}

function revision(){
 setBar('accueil','Révision CCF · '+cname());
 const all=[];
 pub().forEach(c=>{(c.qcm||[]).forEach(x=>all.push({...x,shuf:true,src:c.titre}));(c.vf||[]).forEach(x=>all.push({q:x.a,choix:['Vrai','Faux'],ok:x.v?0:1,expl:x.expl,src:c.titre}))});
 app.innerHTML=`<div class="wrap page"><h1>Révision CCF</h1><p style="color:var(--soft)">15 questions tirées au hasard dans tous les cours. Chaque série est différente.</p><div id="pane"></div></div>`;
 if(!all.length){$('#pane').innerHTML='<p>Pas encore de questions pour cette classe.</p>';return}
 quiz($('#pane'),shuffle(all).slice(0,15),'revision-'+cls,null);
}

function route(){if(!D)return;let h=location.hash.slice(1);if(h===''||h==='accueil'||D.classes[h])lastR=null;stopT();accMap.m=null;
 if(h==='prof'||h==='eleve'){PROF=h==='prof';store.set('prof',PROF);h=cls||'choix';history.replaceState(null,'','#'+h)}
 if(D.classes[h]){cls=h;store.set('classe',h);setCls(cls);home()}
 else if(h==='choix')chooser();
 else if(!cls)chooser();
 else if((setCls(cls),false)){}
 else if(h.startsWith('ctx-'))contexte(h.slice(4));
 else if(h.startsWith('memo-'))memo(h.slice(5));
 else if(h.startsWith('t-'))theme(h.slice(2));
 else if(h.startsWith('m-'))module(h.slice(2));
 else if(h.startsWith('r-'))rubric(h.slice(2));
 else if(h.startsWith('g-'))game(h.slice(2));
 else if(h==='tp'){lastR=null;tpPage()}
 else if(h==='menus')menusPage();
 else if(h==='videos')videosPage();
 else if(h.startsWith('c-')){curTab='fiche';course(h.slice(2))}
 else if(h==='revision')revision();
 else home();
 mountScene();scrollTo(0,0)}
addEventListener('hashchange',route);
fetch('data/cours.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{D=j;PROF=!!store.get('prof');const s=store.get('classe');if(D.classes[s])cls=s;route()}).catch(()=>{app.innerHTML='<div class="wrap err">Impossible de charger les cours. Vérifie ta connexion et recharge la page.</div>'});
}
